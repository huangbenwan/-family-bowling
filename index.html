<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家族保齡球計分</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9F1EC; --card:#F7FBF8; --ink:#1B2A4A; --muted:#5B6B80; --line:#C6D6CD;
  --red:#C8283C; --redsoft:#F6DCE0; --boy:#1E5AA8; --girl:#C2185B; --gold:#D99A1E; --goldsoft:#FBEBC8; --lane:#2E5E8C; --lanesoft:#DCE7F2;
  --f:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141C2B; --card:#1D2739; --ink:#E6ECF5; --muted:#9AA8BC; --line:#2F3C53;
  --red:#F06A7B; --redsoft:#3C2129; --boy:#8AB8F0; --girl:#F48FB1; --gold:#F2B940; --goldsoft:#3A2F17; --lane:#7FB0E0; --lanesoft:#1F3149;}}
:root[data-theme="dark"]{
  --paper:#141C2B; --card:#1D2739; --ink:#E6ECF5; --muted:#9AA8BC; --line:#2F3C53;
  --red:#F06A7B; --redsoft:#3C2129; --boy:#8AB8F0; --girl:#F48FB1; --gold:#F2B940; --goldsoft:#3A2F17; --lane:#7FB0E0; --lanesoft:#1F3149;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55}
.wrap{max-width:680px;margin:0 auto;padding:0 14px 90px}
header{padding:22px 2px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:flex-end;gap:10px;min-width:0}
.logo{height:64px;width:auto;flex:none;display:block;margin-bottom:-4px}
h1{white-space:nowrap;margin:0;font-size:26px;font-weight:900;letter-spacing:.02em}
h1 small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.pins{font-family:var(--num);font-size:15px;color:var(--muted);text-align:right}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:6px;padding:8px 0 10px;border-bottom:2px solid var(--ink)}
nav button{flex:1;border:0;background:transparent;font:700 16px var(--f);color:var(--muted);padding:9px 4px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--paper)}
h2{font-size:18px;margin:22px 0 4px}
.hint{color:var(--muted);font-size:14px;margin:0 0 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:500 16px var(--f);padding:7px 13px;border-radius:999px;cursor:pointer;min-height:40px}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip.sel{border-color:var(--gold);background:var(--goldsoft);color:var(--ink);box-shadow:0 0 0 2px var(--gold)}
.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.nm{font-weight:700}
label.sm{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
input[type=number],input[type=text]{font:600 18px var(--num);width:66px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);text-align:center}
input[type=text]{font:500 16px var(--f);width:auto;flex:1;text-align:left}
input:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tog{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--card);transition:left .15s}
.tog:checked{background:var(--gold)}.tog:checked::after{left:21px}
.btn{border:0;border-radius:10px;padding:11px 16px;font:700 16px var(--f);cursor:pointer;background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.warn{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pair{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.pair:last-child{border-bottom:0}
.pair .vs{font:700 14px var(--num);color:var(--muted)}
.pair .who{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px;font:700 16px var(--f);cursor:pointer;min-height:44px}
.pair .who.win{background:var(--goldsoft);border-color:var(--gold)}
.pair .who.lose{color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;padding:4px 8px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);font:700 14px var(--f);padding:8px 12px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{border-radius:12px;padding:10px 12px;border:1.5px solid var(--line);background:var(--card)}
.team h3{margin:0 0 4px;font-size:15px}
.team .tot{font:700 40px/1 var(--num)}
.team.lead{border-color:var(--gold);background:var(--goldsoft)}
.team .mem{font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;margin-left:6px;vertical-align:2px}
.tag.A{background:var(--lanesoft);color:var(--lane)}.tag.B{background:var(--redsoft);color:var(--red)}
.tag.b{background:var(--goldsoft);color:var(--gold)}
.bingo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bingo input{width:100%}
.cp{font-weight:700;color:var(--gold)}
#imgOut img{width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin-top:10px;-webkit-touch-callout:default}
.tag.i{background:var(--goldsoft);color:var(--gold)}
.score{border-bottom:1px dashed var(--line);padding:10px 2px}
.score:last-child{border-bottom:0}
.score .top{display:flex;justify-content:space-between;align-items:baseline}
.score .fields{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.adj{font:700 22px var(--num)}
.money{font:700 18px var(--num);white-space:nowrap}
.pos{color:var(--lane)}.neg{color:var(--red)}.zero{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:15px}
.mx td,.mx th{white-space:nowrap}
.mx .mk{font-size:12px;color:var(--muted)}
.mx .tt{background:var(--lanesoft);font-weight:700}
.mx td.nm{position:sticky;left:0;background:var(--card)}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:13px;color:var(--muted);font-weight:500}
td.money{font-size:17px}
tfoot td{border-bottom:0;font-weight:700}
.scroll{overflow-x:auto}
.game{margin-top:10px}
.game summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
.game summary::-webkit-details-marker{display:none}
.empty{padding:22px 10px;text-align:center;color:var(--muted)}
.stick{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--ink);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
.stick .in{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:center}
.stick .msg{flex:1;font-size:14px;color:var(--muted)}
.hide{display:none!important}
dialog{border:0;border-radius:14px;padding:18px;background:var(--card);color:var(--ink);max-width:340px;width:calc(100% - 40px)}
dialog::backdrop{background:rgba(10,15,25,.55)}
dialog p{margin:0 0 14px;font-size:17px;font-weight:700}
.line{background:#06C755;color:#fff;text-decoration:none;display:inline-flex;align-items:center}
textarea{width:100%;min-height:160px;font:14px var(--f);padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
input[type=date]{font:600 17px var(--f);padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font:700 30px/1.1 var(--num)}
.stat span{font-size:13px;color:var(--muted)}
.stat.money b{font-size:26px}
.lb td.nm button{all:unset;cursor:pointer;font-weight:700;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.spark{width:100%;height:auto;display:block}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}}
.boy{color:var(--boy)}.girl{color:var(--girl)}
.lb td.nm button.boy{color:var(--boy)}.lb td.nm button.girl{color:var(--girl)}
.chip.boy,.chip.girl{font-weight:700}
.chip.boy.on{background:var(--boy);border-color:var(--boy);color:#fff}
.chip.girl.on{background:var(--girl);border-color:var(--girl);color:#fff}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.rcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.rec .src{font-size:11px;font-weight:700;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:5px;vertical-align:2px}
.tkline{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);font-size:13px;font-weight:700;line-height:1.45}
.tkline b{font:700 17px var(--num);color:var(--ink)}
.lbbar{display:flex;align-items:center;gap:10px;width:100%;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 16px;font:700 18px var(--f);cursor:pointer;text-align:left}
.lbbar span:first-child{font-size:22px}
.lbbar span:last-child{font-size:22px;font-weight:500}
.lbbar.on{background:var(--ink);color:var(--paper)}
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mbtn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:9px 1px;font:700 15px var(--f);cursor:pointer;min-height:46px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbtn.boy{color:var(--boy)}.mbtn.girl{color:var(--girl)}
.mbtn.boy.on{background:var(--boy);border-color:var(--boy);color:#fff}
.mbtn.girl.on{background:var(--girl);border-color:var(--girl);color:#fff}
.recs .rh{font-weight:900;font-size:15px;text-align:center;padding:6px;border-radius:10px;background:var(--ink);color:var(--paper)}
.rec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-width:0}
.rec .ic{font-size:18px;margin-right:4px;vertical-align:-2px}
.rec .rt{font-size:12.5px;color:var(--muted);display:block;line-height:1.4}
.rec .rv{font-weight:700;margin-top:4px;line-height:1.35;word-break:break-word}
.rec .rv b{font:700 22px var(--num);color:var(--ink);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<dialog id="dlg"><p id="dlgMsg"></p><div class="btns" style="margin:0;justify-content:flex-end"><button class="btn ghost" id="dlgNo">取消</button><button class="btn" id="dlgYes" style="background:var(--red)">確定</button></div></dialog>
<script>
const KEY='family-bowling-v1';
const DEFAULT=['軍','靖','WD瀧','Yu','阿娟','見雄','俊儀','開庭','宏進','川平','川豪','紀婷'];
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function newId(){return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
const fresh=()=>({date:today(),bingo:Array(12).fill(''),roster:[...DEFAULT],present:{},hcp:{},hcpI:{},indiv:{},turkeyP:{},noCount:{},useHcpIndiv:true,games:[],cur:{pairs:[],solo:{},scores:{},pick:null,mode:'rps',manual:{}},tab:'setup'});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
S=Object.assign(fresh(),S); S.history=Array.isArray(S.history)?S.history:[]; S.practice=Array.isArray(S.practice)?S.practice:[]; S.history.forEach(d=>{if(!d.id)d.id=newId()}); S.hcpI=S.hcpI||{}; S.turkeyP=S.turkeyP||{}; S.noCount=S.noCount||{}; if(!Array.isArray(S.bingo)||S.bingo.length!==12){const o=Array.isArray(S.bingo)?S.bingo:[];S.bingo=Array.from({length:12},(_,i)=>o[i]!=null?o[i]:'')}
(function rename(o,n){ // 舊紀錄改名
  if(!S.roster.includes(o))return;
  S.roster=S.roster.map(x=>x===o?n:x);
  ['present','hcp','hcpI','indiv','turkeyP','noCount'].forEach(k=>{if(o in S[k]){S[k][n]=S[k][o];delete S[k][o]}});
  const mv=m=>{if(m&&o in m){m[n]=m[o];delete m[o]}};
  S.games.forEach(g=>{mv(g.teams);mv(g.scores);mv(g.indiv)});
  mv(S.cur.scores);mv(S.cur.solo);
  S.cur.pairs.forEach(p=>{for(let i=0;i<3;i++)if(p[i]===o)p[i]=n});
  if(S.cur.pick===o)S.cur.pick=n;
})('紀庭','紀婷');
function ask(msg,yes){const d=document.getElementById('dlg');document.getElementById('dlgMsg').textContent=msg;
  document.getElementById('dlgYes').onclick=()=>{d.close();yes()};document.getElementById('dlgNo').onclick=()=>d.close();
  if(d.showModal)d.showModal();else if(window.confirm(msg))yes();}
const fmtDate=s=>s?s.replace(/-/g,'/'):'';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} if(typeof scheduleSync==='function')scheduleSync()}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MALE=['軍','WD瀧','WD','俊儀','宏進','見雄','川平','川豪'];
const isMale=n=>MALE.includes(n);
const nm=n=>`<span class="${isMale(n)?'boy':'girl'}">${esc(n)}</span>`;
const present=()=>S.roster.filter(n=>S.present[n]);
const money=n=>{n=Math.round(n);return n>0?`<span class="money pos">+$${n}</span>`:n<0?`<span class="money neg">−$${-n}</span>`:`<span class="money zero">$0</span>`};
const TEAM={A:'甲隊',B:'乙隊'};

/* ---------- team assignment from pairs ---------- */
// 依上一局實際分數排名：第1對第2、第3對第4…，奇數時最後一名落單
function rankOrder(){
  const g=S.games[S.games.length-1]; if(!g)return null;
  const p=present(), sc=n=>g.scores[n]&&g.scores[n].s!==''?+g.scores[n].s:-1;
  const inG=p.filter(n=>g.teams[n]).sort((a,b)=>sc(b)-sc(a)), notG=p.filter(n=>!g.teams[n]);
  return inG.concat(notG);
}
function rankPairs(){
  const o=rankOrder(); if(!o)return null; const pr=[];
  for(let k=0;k+1<o.length;k+=2)pr.push([o[k],o[k+1]]);
  return {pairs:pr,solo:o.length%2?o[o.length-1]:null};
}
function applyRankPairs(c){const r=rankPairs(); if(!r)return false; c.pairs=r.pairs.map(x=>[x[0],x[1],null]); c.solo={}; c.pick=null; c.mode='rps'; return true}
function newCur(){return {pairs:[],solo:{},scores:{},pick:null,mode:(S.cur&&S.cur.mode)||'rps',manual:{}}}
const inT=(g,n)=>g.turkeyP?!!g.turkeyP[n]:!!g.indiv[n];
function teamsOf(){
  const t={};
  if(S.cur.mode==='manual'){Object.entries(S.cur.manual||{}).forEach(([n,v])=>{if(S.present[n])t[n]=v});return t}
  S.cur.pairs.forEach(p=>{ if(p[2]){t[p[2]]='A';t[p[0]===p[2]?p[1]:p[0]]='B';} });
  Object.entries(S.cur.solo).forEach(([n,v])=>{ if(S.present[n]&&!inPair(n)) t[n]=v; });
  return t;
}
const inPair=n=>S.cur.pairs.some(p=>p[0]===n||p[1]===n);
function cleanCur(){
  S.cur.pairs=S.cur.pairs.filter(p=>S.present[p[0]]&&S.present[p[1]]);
  if(S.cur.pick&&!S.present[S.cur.pick])S.cur.pick=null;
}

/* ---------- money computation for one game ---------- */
function compute(g){
  const names=Object.keys(g.teams), d={};
  names.forEach(n=>d[n]={team:0,indiv:0,turkey:0});
  const sc=n=>g.scores[n]||{};
  const raw=n=>+sc(n).s||0, adj=n=>raw(n)+(+sc(n).h||0);
  let A=0,B=0; const cnt=n=>!sc(n).nc; names.filter(cnt).forEach(n=>g.teams[n]==='A'?A+=adj(n):B+=adj(n));
  const loser=A>B?'B':B>A?'A':null;
  if(loser) names.forEach(n=>{if(g.teams[n]===loser)d[n].team=-200});
  const bingo={}, bl=(g.bingo||[]).filter(v=>v!==''&&v!=null).map(Number);
  if(bl.length) names.forEach(n=>{ const s=sc(n).s; if(s!==''&&s!=null&&bl.includes(+s)) bingo[n]=+s; }); // 打中賓果→優惠券，不影響金額
  const P=names.filter(n=>g.indiv[n]); const val=n=>g.v>=2?raw(n)+(+sc(n).hi||0):(g.useHcp?adj(n):raw(n));
  const place={};
  if(P.length>=2){
    const vals=[...new Set(P.map(val))].sort((a,b)=>b-a);
    const win=P.filter(n=>val(n)===vals[0]);
    let exempt=[];
    // 第二名不再免輸，除第一名外全部 -$100
    const lose=P.filter(n=>!win.includes(n)&&!exempt.includes(n));
    lose.forEach(n=>{d[n].indiv=-100;place[n]='輸'});
    exempt.forEach(n=>place[n]='第二');
    win.forEach(n=>{d[n].indiv=lose.length*100/win.length;place[n]=lose.length?'贏':'平'});
  }
  const T=names.filter(n=>inT(g,n)), tlog=[];
  if(T.length>=2) T.forEach(n=>{const k=+sc(n).t||0; if(k>=3){const amt=(k-2)*20, from=T.filter(o=>o!==n);
    from.forEach(o=>{d[o].turkey-=amt;d[n].turkey+=amt}); tlog.push({to:n,k,amt,from})}});
  return {A,B,loser,d,P,place,adj,val,bingo,tlog};
}
function curGame(){
  const teams=teamsOf(), scores={}, indiv={};
  const turkeyP={};
  Object.keys(teams).forEach(n=>{scores[n]=S.cur.scores[n]||{s:'',h:S.hcp[n]||0,hi:S.hcpI[n]||0,t:0}; if(scores[n].hi==null)scores[n].hi=S.hcpI[n]||0; if(S.indiv[n])indiv[n]=true; if(S.turkeyP[n])turkeyP[n]=true; if(scores[n].nc==null)scores[n].nc=!!S.noCount[n]});
  return {v:2,teams,scores,indiv,turkeyP,bingo:S.bingo.filter(v=>v!==''),useHcp:S.useHcpIndiv};
}

const KIND={team:'團體賽',indiv:'個人賽',turkey:'火雞賽'};
function matrix(k){
  const P={};
  S.games.forEach((g,gi)=>{const r=compute(g);
    Object.keys(g.teams).forEach(n=>{
      const on=k==='team'||(k==='indiv'?(!!g.indiv[n]&&r.P.length>=2):(inT(g,n)&&Object.keys(g.teams).filter(x=>inT(g,x)).length>=2));
      if(!on)return;

/* ---------- 生涯紀錄 ---------- */
function sessions(){ // 已存的每一天＋今天（還沒結束的）
  const L=S.history.map((d,i)=>({date:d.date,games:d.games,hi:i}));
  if(S.games.length)L.push({date:S.date,games:S.games,today:true});
  return L;
}
function career(){
  const P={};
  const me=n=>P[n]||(P[n]={games:[],days:{},team:0,indiv:0,turkey:0,tw:0,tl:0,td:0,iw:0,ip:0,tk:0,tkBest:0,cp:0});
  sessions().forEach((ss,si)=>ss.games.forEach((g,gi)=>{const r=compute(g);
    Object.keys(g.teams).forEach(n=>{const s=g.scores[n]; if(!s||s.s===''||s.s==null)return; const o=me(n), sc=+s.s;
      o.games.push({date:ss.date,g:gi+1,s:sc,si});
      const dk=si; const d=o.days[dk]||(o.days[dk]={date:ss.date,today:ss.today,hi:ss.hi,n:0,sum:0,best:0,team:0,indiv:0,turkey:0}); d.n++;d.sum+=sc;d.best=Math.max(d.best,sc);
      const x=r.d[n]; o.team+=x.team;o.indiv+=x.indiv;o.turkey+=x.turkey; d.team+=x.team;d.indiv+=x.indiv;d.turkey+=x.turkey;
      if(!r.loser)o.td++; else if(g.teams[n]===r.loser)o.tl++; else o.tw++;
      if(g.indiv[n]&&r.P.length>=2){o.ip++; if(r.place[n]==='贏')o.iw++;}
      const t=+s.t||0; if(inT(g,n)&&t>=3){o.tk++;o.tkBest=Math.max(o.tkBest,t)}
      if(r.bingo[n])o.cp++;
    })}));
  Object.values(P).forEach(o=>{const a=o.games.map(x=>x.s);o.n=a.length;o.avg=a.length?a.reduce((p,q)=>p+q,0)/a.length:0;o.best=Math.max(0,...a);o.bestAt=o.games.find(x=>x.s===o.best);});
  return P;
}
function spark(games){
  const L=games.slice(-12); if(L.length<2)return '';
  const W=360,H=170,pl=30,pr=8,pt=12,pb=26, max=Math.max(300,...L.map(x=>x.s)), min=0;
  const X=i=>pl+(W-pl-pr)*(L.length===1?0:i/(L.length-1)), Y=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min));
  const avg=L.reduce((a,x)=>a+x.s,0)/L.length;
  const pts=L.map((x,i)=>`${X(i).toFixed(1)},${Y(x.s).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="最近 ${L.length} 局分數走勢">
    ${[0,100,200,300].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join('')}
    <line x1="${pl}" x2="${W-pr}" y1="${Y(avg)}" y2="${Y(avg)}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <polyline points="${pts}" fill="none" stroke="var(--lane)" stroke-width="2.5" stroke-linejoin="round"/>
    ${L.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.s)}" r="4" fill="var(--card)" stroke="var(--lane)" stroke-width="2"/><text x="${X(i)}" y="${Y(x.s)-9}" text-anchor="middle" font-size="11" fill="var(--ink)">${x.s}</text>`).join('')}
  </svg><p class="hint" style="margin:2px 0 0">最近 ${L.length} 局分數，金色虛線是這幾局的平均 ${avg.toFixed(1)}</p>`;
}

function vCareerTeam(){

  if(!who){

    new Set([...Object.keys(P),...Object.keys(Q)]).forEach(n=>{const tb=P[n]?P[n].best:0, qb=Q[n]?Q[n].best:0;
      C[n]={best:Math.max(tb,qb), src:tb>=qb?(qb===tb&&qb?'團體賽、偷練':'團體賽'):'偷練', tkBest:Math.max(P[n]?P[n].tkBest:0,Q[n]?Q[n].tkBest:0)}});
    const top=(D,male,key,fmt)=>{const L=Object.keys(D).filter(n=>isMale(n)===male&&D[n][key]>0); if(!L.length)return null;
      const v=Math.max(...L.map(n=>D[n][key])); return {who:L.filter(n=>D[n][key]===v),val:fmt(v)}};
    const pt=v=>v+' 分', av=v=>v.toFixed(1)+' 分', tk=v=>v+' 支';

/* ---------- 雲端同步（Firebase Firestore，REST） ---------- */
const FB={apiKey:"AIzaSyCuUa7N43CytRteEKRrJjDeHm-ikzmOhHs",projectId:"family-bowling"};
const FBURL=`https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents/bowling/meta`;
const SHARED=['roster','present','hcp','hcpI','indiv','turkeyP','noCount','bingo','date'];
const COLS=['days','practice'];
const emptyLast=()=>({meta:null,days:{},practice:{}});
const SYNC={ready:false,busy:false,timer:null,offer:false,state:'',last:emptyLast()};
function snapshot(){ // 目前要放上雲端的內容（每份都是 JSON 字串）
  const m={}; SHARED.forEach(k=>m[k]=S[k]);
  const days={}, practice={};
  S.history.forEach(d=>{if(!d.id)d.id=newId(); days[d.id]=JSON.stringify({date:d.date,games:d.games,archived:true})});
  if(S.games.length){ if(!S.todayId)S.todayId=newId(); days[S.todayId]=JSON.stringify({date:S.date,games:S.games,archived:false}); }
  S.practice.forEach(x=>{if(!x.id)x.id=newId(); practice[x.id]=JSON.stringify({name:x.name,date:x.date,s:x.s,t:x.t})});
  return {meta:JSON.stringify(m),days,practice};
}
function setSync(st){SYNC.state=st; const el=document.getElementById('sync'); if(el)el.textContent={ok:'☁️ 已同步',busy:'☁️ 同步中…',off:'⚠️ 離線（先存在本機）',wait:'☁️ 連線中…'}[st]||''}
async function fb(method,path,body){
  const r=await fetch(FBURL+path+(path.includes('?')?'&':'?')+'key='+FB.apiKey,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  if(r.status===404)return null; if(!r.ok)throw new Error('HTTP '+r.status); return r.status===204?{}:r.json();
}
async function listCol(col){
  const out={}; let tok='';
  do{ const r=await fb('GET',`/${col}?pageSize=300${tok?'&pageToken='+encodeURIComponent(tok):''}`);
    ((r&&r.documents)||[]).forEach(d=>{const id=d.name.split('/').pop(); const v=d.fields&&d.fields.json&&d.fields.json.stringValue; if(v)out[id]=v});
    tok=r&&r.nextPageToken||''; }while(tok);
  return out;
}
async function pullRemote(){
  const [meta,days,practice]=await Promise.all([fb('GET',''),listCol('days'),listCol('practice')]);
  return {meta:meta&&meta.fields&&meta.fields.json?meta.fields.json.stringValue:null,days,practice};
}
function applyRemote(R){
  if(R.meta){const m=JSON.parse(R.meta); SHARED.forEach(k=>{if(m[k]!==undefined)S[k]=m[k]})}
  const hist=[]; let tday=null;
  Object.entries(R.days).forEach(([id,js])=>{const d=JSON.parse(js); if(d.archived)hist.push({id,date:d.date,games:d.games||[]}); else if(!tday||id>tday.id)tday={id,date:d.date,games:d.games||[]}});
  hist.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.id<b.id?-1:1));
  S.history=hist;
  if(tday){S.games=tday.games;S.todayId=tday.id;S.date=tday.date||S.date}else{S.games=[];S.todayId=null}
  S.practice=Object.entries(R.practice).map(([id,js])=>Object.assign({id},JSON.parse(js))).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.id<b.id?-1:1));
  if(S.editGame!=null&&!gameAt(S.editGame))S.editGame=null;
}
const sameCols=(a,b)=>COLS.every(c=>{const ka=Object.keys(a[c]||{}),kb=Object.keys(b[c]||{}); return ka.length===kb.length&&ka.every(k=>a[c][k]===(b[c]||{})[k])});
const changed=()=>{const s=snapshot(); return s.meta!==SYNC.last.meta||!sameCols(s,SYNC.last)};
function scheduleSync(){ if(!SYNC.ready)return; clearTimeout(SYNC.timer); SYNC.timer=setTimeout(doPush,700); }
async function doPush(){
  if(!SYNC.ready||SYNC.busy)return; if(!changed()){if(SYNC.state!=='off')setSync('ok');return}
  SYNC.busy=true; setSync('busy');
  try{
    const s=snapshot(), L=SYNC.last, now=String(Date.now());
    if(s.meta!==L.meta){await fb('PATCH','',{fields:{json:{stringValue:s.meta},updated:{integerValue:now}}}); L.meta=s.meta}
    for(const c of COLS){ L[c]=L[c]||{};
      for(const [id,js] of Object.entries(s[c])) if(js!==L[c][id]){await fb('PATCH',`/${c}/${id}`,{fields:{json:{stringValue:js},updated:{integerValue:now}}}); L[c][id]=js}
      for(const id of Object.keys(L[c])) if(!(id in s[c])){await fb('DELETE',`/${c}/${id}`); delete L[c][id]}
    }
    setSync('ok');
  }catch(e){setSync('off')}
  SYNC.busy=false; if(changed())scheduleSync();
}
async function doPull(first){
  if(SYNC.busy)return;
  if(!first&&SYNC.ready&&changed()){doPush();return}            // 本機有沒上傳的修改，先上傳
  const a=document.activeElement; if(!first&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return; // 正在輸入時先不更新畫面
  try{
    const R=await pullRemote();
    const noRecs=!Object.keys(R.days).length&&!Object.keys(R.practice).length;
    if(first&&noRecs&&(S.history.length||S.games.length||S.practice.length)){ // 雲端還沒有紀錄，這支手機有
      SYNC.offer=true; setSync('ok'); render(); return;
    }
    if(R.meta||!noRecs){
      const same=R.meta===SYNC.last.meta&&sameCols(R,SYNC.last);
      if(!same||first){ applyRemote(R); SYNC.last={meta:R.meta,days:{...R.days},practice:{...R.practice}}; SYNC.ready=true; render(); }
    } else { SYNC.last=emptyLast(); }
    SYNC.ready=true; setSync('ok');
  }catch(e){ setSync('off'); if(first){SYNC.ready=false;} }
}
function uploadBanner(){
  if(!SYNC.offer)return '';
  const n=S.history.length+(S.games.length?1:0);
  return `<div class="box" style="margin-top:12px;border:2px solid var(--gold);background:var(--goldsoft)">
    <b>雲端還沒有任何紀錄</b><p class="hint" style="margin:4px 0 0">這支手機裡有 ${n} 天的比賽紀錄${S.practice.length?`和 ${S.practice.length} 筆偷練分數`:''}。上傳後，大家用自己的手機打開網址就能看到。只要記分的那支手機上傳一次就好。</p>
    <div class="btns"><button class="btn" data-act="upload">上傳這支手機的紀錄</button><button class="btn ghost" data-act="noupload">先不要</button></div></div>`;
}
function startSync(){
  setSync('wait'); doPull(true);
  setInterval(()=>{if(document.visibilityState==='visible')doPull(false)},15000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')doPull(false)});
  window.addEventListener('online',()=>doPull(!SYNC.ready));
}

    o.list.push(x); o.n++; o.sum+=s; if(s>o.best){o.best=s;o.bestAt=x} const t=+x.t||0; if(t>=3&&t>o.tkBest)o.tkBest=t;});
  Object.values(P).forEach(o=>o.avg=o.n?o.sum/o.n:0);
  return P;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const tb=e.target.closest('nav button'); if(tb){S.tab=tb.dataset.tab;render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-act]'); if(!b)return;
  const n=b.dataset.n, i=+b.dataset.i, c=S.cur;
  switch(b.dataset.act){
    case 'present': S.present[n]=!S.present[n]; if(S.present[n]&&S.hcp[n]==null)S.hcp[n]=0; break;
    case 'add': {const v=document.getElementById('newName').value.trim(); if(v&&!S.roster.includes(v)){S.roster.push(v);S.present[v]=true;S.hcp[v]=0;S.hcpI[v]=0} break;}
    case 'tab': S.tab=b.dataset.t; break;
    case 'pick': if(!c.pick)c.pick=n; else if(c.pick===n)c.pick=null; else {c.pairs.push([c.pick,n,null]);c.pick=null} break;
    case 'win': c.pairs[i][2]=n; break;
    case 'unpair': c.pairs.splice(i,1); break;
    case 'solo': c.solo[n]=b.dataset.v; break;
    case 'clearpairs': c.pairs=[];c.solo={};c.pick=null;c.manual={}; break;
    case 'editgame': S.editGame=b.dataset.ref; if(String(S.editGame)[0]==='h')S.openDay=+S.editGame.split(':')[1]; render(); setTimeout(()=>{const e=document.getElementById('editBox');if(e)e.scrollIntoView({block:'start'})},0); return;
    case 'editdone': S.editGame=null; break;
    case 'egteam': {const g=gameAt(b.dataset.ref); if(g)g.teams[n]=b.dataset.v; break;}
    case 'openday': S.openDay=S.openDay===i?null:i; S.editGame=null; break;
    case 'clearbingo': ask('確定清空所有賓果數字？',()=>{S.bingo=Array(12).fill('');render()}); return;
    case 'rankpair': applyRankPairs(c); break;
    case 'billtab': S.billTab=b.dataset.v; break;
    case 'mode': c.mode=b.dataset.v; break;
    case 'man': (c.manual=c.manual||{})[n]=b.dataset.v; break;
    case 'random': { // 保留已配好的組合與落單者，只幫沒決定的人猜拳
      c.pick=null;
      c.pairs.forEach(pr=>{ if(!pr[2]) pr[2]=Math.random()<.5?pr[0]:pr[1]; });
      const rest=present().filter(x=>!inPair(x)).sort(()=>Math.random()-.5);
      if(rest.length>=2){ const keepSolo=rest.length%2?rest.find(x=>c.solo[x])||null:null;
        const pool=keepSolo?rest.filter(x=>x!==keepSolo):rest;
        for(let k=0;k+1<pool.length;k+=2)c.pairs.push([pool[k],pool[k+1],Math.random()<.5?pool[k]:pool[k+1]]); }
      break;}
    case 'save': {const g=curGame(); S.games.push(JSON.parse(JSON.stringify(g))); S.cur=newCur(); S.tab='bill'; window.scrollTo(0,0); break;}
    case 'delgame': ask(`確定刪除第 ${i+1} 局？`,()=>{S.games.splice(i,1);render()}); return;
    case 'upload': ask('把這支手機的紀錄上傳到雲端，讓大家都看得到？',()=>{SYNC.offer=false;SYNC.last=emptyLast();SYNC.ready=true;render();doPush()}); return;
    case 'noupload': SYNC.offer=false; SYNC.ready=true; SYNC.last=snapshot(); break;
    case 'archive': ask(`把 ${fmtDate(S.date)} 的 ${S.games.length} 局存進生涯紀錄？`,()=>{S.history.push({id:S.todayId||newId(),date:S.date,games:S.games});S.todayId=null;S.games=[];S.cur=newCur();S.editGame=null;S.date=today();S.tab='career';render();window.scrollTo(0,0)}); return;
    case 'who': S.careerWho=n||null; S.prEdit=null; break;
    case 'cview': S.careerView=b.dataset.v; S.prEdit=null; break;
    case 'pradd': {const s=document.getElementById('prS').value, t=+document.getElementById('prT').value||0, d=document.getElementById('prDate').value||today(), msg=document.getElementById('prMsg');
      if(s===''||isNaN(+s)||+s<0||+s>300){msg.textContent='請輸入 0–300 的分數。';msg.style.color='var(--red)';return}
      S.practice.push({id:newId(),name:S.careerWho,date:d,s:String(+s),t}); break;}
    case 'predit': S.prEdit=b.dataset.id; break;
    case 'prdone': S.prEdit=null; break;
    case 'prdel': {const id=b.dataset.id; ask('確定刪除這筆偷練分數？',()=>{S.practice=S.practice.filter(x=>x.id!==id);S.prEdit=null;render()}); return;}
    case 'delday': ask(`確定從生涯紀錄刪除 ${fmtDate(S.history[i].date)} 這天？`,()=>{S.history.splice(i,1);S.openDay=null;S.editGame=null;render()}); return;
    case 'reset': ask('確定清空今天的局數？（不會存進生涯紀錄）',()=>{S.games=[];S.todayId=null;S.cur=newCur();S.date=today();render()}); return;
    case 'next': S.editGame=null; S.cur=newCur(); if(S.cur.mode==='rps')applyRankPairs(S.cur); S.tab='game'; window.scrollTo(0,0); break;
    case 'img': {b.disabled=true;b.textContent='產生中…';
      drawImage().then(async cv=>{const out=document.getElementById('imgOut');
        out.innerHTML=`<img alt="結算表" src="${cv.toDataURL('image/png')}"><div class="btns"><button class="btn line" id="shareImg">分享 / 儲存圖片</button></div><p class="hint" id="shareHint" style="margin-top:8px">按下後選 LINE 傳到群組，或選「儲存影像」存到相簿。</p>`;
        b.disabled=false;b.textContent='重新產生圖片';
        const sb=document.getElementById('shareImg'), hint=document.getElementById('shareHint');
        const name=`保齡球結算_${S.date}.png`;
        sb.onclick=()=>cv.toBlob(async bl=>{
          const f=new File([bl],name,{type:'image/png'});
          if(navigator.canShare&&navigator.canShare({files:[f]})){
            try{await navigator.share({files:[f]});return}catch(err){if(err&&err.name==='AbortError')return}
          }
          const u=URL.createObjectURL(bl);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
          setTimeout(()=>URL.revokeObjectURL(u),4000);
          hint.textContent='圖片已下載。手機上也可以長按圖片儲存或分享。';
        },'image/png');
      }).catch(()=>{b.disabled=false;b.textContent='產生結算圖片'}); return;}
    case 'copy': {const ta=document.getElementById('exp');const txt=exportText();
      const done=()=>{b.textContent='已複製';setTimeout(()=>b.textContent='複製文字',1500)};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>{ta.classList.remove('hide');ta.select()});
      else{ta.classList.remove('hide');ta.select()} return;}
  }
  render();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.pr!=null){const x=S.practice.find(q=>q.id===el.dataset.pr); if(!x)return; const k=el.dataset.k;
    if(k==='s'){if(el.value===''||isNaN(+el.value))return; x.s=String(+el.value)} else if(k==='t')x.t=+el.value||0; else if(el.value)x.date=el.value;
    render(); return}
  if(el.dataset.eg==null)return;
  const g=gameAt(el.dataset.eg); if(!g)return; const s=g.scores[el.dataset.n]; const k=el.dataset.k;
  if(k==='nc')s.nc=el.checked; else s[k]=k==='s'?el.value:(+el.value||0);
  render();
});
document.addEventListener('input',e=>{
  if(e.target.dataset.eg!=null||e.target.dataset.pr!=null||/^pr/.test(e.target.id))return;
  if(e.target.dataset.hd!=null){const d=S.history[+e.target.dataset.hd]; if(d&&e.target.value){d.date=e.target.value;save()} return}
  const el=e.target, k=el.dataset.in, n=el.dataset.n; if(!k)return;
  if(k==='date'){S.date=el.value;save();document.getElementById('gcount').innerHTML=fmtDate(S.date)+(S.games.length?`<br>已打 ${S.games.length} 局`:'');return}
  if(k==='bingo'){S.bingo[+el.dataset.i]=el.value;save();return}
  if(k==='hcp'){S.hcp[n]=+el.value||0; save(); return}
  if(k==='indiv'){S.indiv[n]=el.checked; save(); return}
  if(k==='noCount'){S.noCount[n]=el.checked; save(); return}
  if(k==='nc'){const s=S.cur.scores[n]||(S.cur.scores[n]={s:'',h:S.hcp[n]||0,hi:S.hcpI[n]||0,t:0});s.nc=el.checked;
    const tg=document.querySelector(`[data-nc="${CSS.escape(n)}"]`);if(tg)tg.classList.toggle('hide',!el.checked); refreshLive(); return}
  if(k==='hcpI'){S.hcpI[n]=+el.value||0; save(); return}
  if(k==='turkeyP'){S.turkeyP[n]=el.checked; save(); return}
  const s=S.cur.scores[n]||(S.cur.scores[n]={s:'',h:S.hcp[n]||0,hi:S.hcpI[n]||0,t:0});
  s[k]=el.value; refreshLive();
});
render();
startSync();
</script>
</body>
</html>
